﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: media: https: http:; media-src 'self' blob: media: https: http:; connect-src 'self' blob: media: https: http:; worker-src 'self' blob:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>娟光月影</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="android.css?v=20261111h" />
  </head>
  <body>
    <div class="app">
      <div class="workspace">
        <header class="topbar">
          <div class="brand">
            <div class="brand-scene">
              <div class="brand-moon-wrap">
                <div class="brand-moon"></div>
              </div>
              <div class="brand-ring-wrap r1">
                <div class="brand-ring ring-a"></div>
              </div>
              <div class="brand-ring-wrap r2">
                <div class="brand-ring ring-b"></div>
              </div>
              <div class="brand-text">娟光月影</div>
            </div>
          </div>

          <nav class="nav">
            <button class="nav-item active" data-view="home">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-5H9v5H4z" /></svg>
              <span>首页</span>
            </button>
            <button class="nav-item" data-view="online">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3c2.6 2.4 4 5.6 4 9s-1.4 6.6-4 9c-2.6-2.4-4-5.6-4-9s1.4-6.6 4-9z" />
              </svg>
              <span>电影院</span>
            </button>
            <button class="nav-item" data-view="music">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 17V6l9-2v11" />
                <circle cx="7" cy="17.5" r="2.2" />
                <circle cx="16" cy="15.5" r="2.2" />
              </svg>
              <span>音乐厅</span>
            </button>
            <button class="nav-item" data-view="tv">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="7" width="18" height="12" rx="2" />
                <path d="M8 4.5 12 7l4-2.5" />
              </svg>
              <span>电视台</span>
            </button>
            <button class="nav-item" data-view="anime">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="6" width="17" height="12" rx="3" />
                <circle cx="9" cy="12" r="1.4" />
                <circle cx="15" cy="12" r="1.4" />
              </svg>
              <span>动漫城</span>
            </button>
            <button class="nav-item" data-view="drama">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="14" height="16" rx="2" />
                <path d="M17 9l4-2v10l-4-2" />
                <path d="M6 8h8M6 12h8M6 16h5" />
              </svg>
              <span>Ai短剧</span>
            </button>
            <button class="nav-item" data-view="settings">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3" />
                <path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z" />
              </svg>
              <span>设置</span>
            </button>
          </nav>

          <div id="musicTabs" class="topbar-tabs hidden"></div>
          <label class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <input id="searchInput" type="search" placeholder="搜索影片名，全网电影剧集" autocomplete="off" />
          </label>
          <div class="topbar-actions">
            <button class="topbar-action" data-view="history" title="历史播放记录">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M12 7v5.2l3.4 2" />
              </svg>
              <span>历史</span>
            </button>
          </div>
          <div class="topbar-drag"></div>
          <div class="win-controls">
            <button id="winMin" class="win-btn" title="最小化">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" /></svg>
            </button>
            <button id="winMax" class="win-btn" title="最大化">
              <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" /></svg>
            </button>
            <button id="winClose" class="win-btn close" title="关闭">
              <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9" /></svg>
            </button>
          </div>
        </header>

        <main id="content" class="content"></main>
      </div>
    </div>

    <div id="detail" class="detail hidden"></div>

    <div id="bookReader" class="book-reader hidden"></div>

    <div id="player" class="player hidden">
      <video id="video" controls playsinline></video>

      <div class="player-top">
        <button id="playerBack" class="icon-btn" title="返回 (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
        </button>
        <div class="player-heading">
          <div class="player-title"></div>
          <div class="player-sub"></div>
        </div>
        <div class="player-tools">
          <button id="playerSubtitle" class="icon-btn text" title="字幕">CC</button>
          <button id="playerExternal" class="icon-btn" title="用系统播放器打开">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-8 8M18 14v5H5V6h5" /></svg>
          </button>
          <button id="playerFullscreen" class="icon-btn" title="全屏 (F)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
          </button>
        </div>
      </div>

      <button id="playerNext" class="player-next hidden" title="播放下一集 (N)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 5.2v13.6L15.2 12z" fill="currentColor" stroke="none" />
          <path d="M18 5v14" />
        </svg>
      </button>

      <div id="playerLoading" class="player-loading hidden">
        <span class="spinner"></span>
        <span>正在加载网络片源…</span>
      </div>

      <div id="playerError" class="player-error hidden">
        <div class="error-mark">!</div>
        <h2>这个视频无法用内置播放器播放</h2>
        <p>通常是 MKV、HEVC 等编码格式不被内置播放器支持，可以用系统播放器打开。</p>
        <div class="error-actions">
          <button class="btn primary" data-action="player-external">用系统播放器打开</button>
          <button class="btn ghost" data-action="player-close">返回片库</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="vendor/hls.min.js"></script>
    <script src="android-shim.js?v=20261111d"></script>
    <script src="app.js?v=20261111e"></script>
    <script src="android-late.js?v=20261111p"></script>
    <script src="activation.js?v=20261107o"></script>
  </body>
</html>
